version: 2
updates:
  # Keep pinned GitHub Actions (SHA pins in .github/workflows) up to date.
  # Cargo updates are deliberately excluded: this is a fork of upstream Zed and
  # dependency bumps arrive via the upstream sync, not Dependabot PRs.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
