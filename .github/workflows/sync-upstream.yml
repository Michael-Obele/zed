name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # NOTE: there is no `workflows:` job permission scope. The ability to
      # push upstream workflow files (.github/workflows/*) to the sync branch
      # comes from the *token*, not job permissions: UPSTREAM_SYNC_TOKEN must
      # have workflow scope (fine-grained PAT: Workflows Read and write, or
      # classic PAT `workflow` scope). Without it the push is rejected with:
      # "refusing to allow ... without `workflow` scope".
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT (UPSTREAM_SYNC_TOKEN) so pushes trigger downstream
          # workflows. Falls back to GITHUB_TOKEN (push succeeds but
          # downstream workflows are skipped by GitHub).
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch tags
        run: |
          git remote add upstream https://github.com/zed-industries/zed.git || git remote set-url upstream https://github.com/zed-industries/zed.git
          git fetch origin main
          git fetch upstream --tags --force

      - name: Resolve the latest stable release
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # /releases/latest excludes prereleases and drafts by definition.
          ref="$(gh api "repos/zed-industries/zed/releases/latest" --jq .tag_name)"
          echo "Latest stable release: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check divergence from the stable tag
        id: diff
        env:
          SYNC_REF: ${{ steps.target.outputs.ref }}
        run: |
          set -euo pipefail
          AHEAD=$(git rev-list --count "HEAD..$SYNC_REF")
          if git merge-base --is-ancestor "$SYNC_REF" HEAD; then
            STATE="current"
          elif git merge-base --is-ancestor HEAD "$SYNC_REF"; then
            STATE="fast-forward"
          else
            # The normal case: main carries fork commits that the stable tag
            # (cut from a separate release branch) does not contain.
            STATE="diverged"
          fi
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "main is $AHEAD commits behind $SYNC_REF (state=$STATE)"

      - name: Close stale sync pull requests
        if: steps.diff.outputs.state == 'current'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          SYNC_REF: ${{ steps.target.outputs.ref }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("sync/stable-")) | .number' |
            while read -r number; do
              gh pr close "$number" --repo "$GITHUB_REPOSITORY" \
                --comment "main now contains $SYNC_REF; closing this sync pull request."
            done

      - name: Fast-forward when possible
        if: steps.diff.outputs.state == 'fast-forward'
        env:
          SYNC_REF: ${{ steps.target.outputs.ref }}
        run: |
          git checkout main
          git merge --ff-only "$SYNC_REF"
          git push origin main
          git push origin "$SYNC_REF"

      - name: Open sync PR on divergence
        if: steps.diff.outputs.state == 'diverged' && steps.diff.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          SYNC_REF: ${{ steps.target.outputs.ref }}
        run: |
          BRANCH="sync/stable-$(date -u +%Y%m%d)"
          git checkout -B "$BRANCH" "$SYNC_REF"
          # The fork's own commits keep main from fast-forwarding to a stable
          # tag, so hand the merge to a human. docs/fork-sync.md has the
          # conflict policy; mcp-nightly also attempts this merge automatically
          # and this PR is the fallback when it hits an unexpected conflict.
          if ! git push -u origin "$BRANCH" --force; then
            echo "::error::Sync push rejected. If the message mentions workflow scope, recreate UPSTREAM_SYNC_TOKEN with workflow scope (fine-grained PAT: Workflows Read and write, or classic 'workflow' scope) in Settings → Secrets → Actions."
            exit 1
          fi
          if ! gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --json number --jq '.[0].number' | grep -q '[0-9]'; then
            BODY=$(printf '%s\n' \
              "Automated sync to the latest stable release $SYNC_REF." \
              "" \
              "main carries fork commits, so this branch cannot fast-forward. Resolve conflicts per docs/fork-sync.md and merge:" \
              "" \
              "- Default: take the stable tag's changes." \
              "- Re-assert crates/zed/RELEASE_CHANNEL (nightly) and the zed-nightly rename in crates/zed/Cargo.toml / script/bundle-linux." \
              "" \
              "mcp-nightly also merges this tag automatically; this PR is the manual fallback when that merge hits an unexpected conflict.")
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "sync: stable $SYNC_REF ($(date -u +%Y-%m-%d))" \
              --body "$BODY"
          fi
